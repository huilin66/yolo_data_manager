[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-data-manager"
version = "1.2.3"
description = "A small toolkit for loading, editing, querying, validating, converting, analyzing, and visualizing YOLO datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
ydm = "yolo_data_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yolo_data_manager = ["web/frontend/dist/**/*"]
